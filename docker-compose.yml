# Local development stack.
#
# Every datastore port below is bound to 127.0.0.1 deliberately. Docker's default
# ("3306:3306") publishes on 0.0.0.0, which on a host with a public IP exposes the
# port to the internet regardless of the OS firewall, because Docker writes its own
# iptables rules. Redis and Qdrant have no authentication, so that would be remotely
# exploitable. Loopback binding keeps the host-run backend working while making the
# ports unreachable from outside the machine.
#
# Credentials default to dev values and are overridable by environment. A real
# deployment must set them, and should not publish these ports at all — the app
# reaches the datastores over the internal Docker network by service name.

services:

  mysql:
    image: mysql:8
    container_name: recall-mysql
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER:-recall}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-recall}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recall}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-recall}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-urecall", "-precall"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: recall-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: recall-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: recall-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  backend:
    build: ./backend
    image: recall-backend:latest
    container_name: recall-backend
    profiles: ["full"]
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://recall:recall@mysql:3306/recall
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  celery_worker:
    build: ./backend
    image: recall-backend:latest
    container_name: recall-celery-worker
    profiles: ["full"]
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://recall:recall@mysql:3306/recall
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build: ./frontend
    image: recall-frontend:latest
    container_name: recall-frontend
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  qdrant_data:
  minio_data: